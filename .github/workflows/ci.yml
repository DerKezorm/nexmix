# Tests, the interface end to end in three browsers, and a trial build of the image, on Linux like the image itself.
# Windows, where the project is written, runs the full set locally; a Windows runner here found only races against
# its slow clock.
# Nothing is published from here: an image goes out only from release.yml, when a tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only unless a job asks for more (only the image job of release.yml writes packages).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test the backend
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  e2e:
    name: End to end in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The backend serves the built interface; the stand-in Plex comes from the backend's tests.
      - name: Install the backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # WebKit on Linux plays the preview the way Safari does (ranges of the sound); on Windows it asks for no media.
      - name: Install the frontend and the browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Build and test end to end
        working-directory: frontend
        run: npm run e2e

  image:
    name: Trial build of the image
    runs-on: ubuntu-latest
    needs: [tests, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build, do not push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: false
